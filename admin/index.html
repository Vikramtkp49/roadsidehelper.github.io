<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - Roadside Helper</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/admin.css">
</head>
<body>
    <div class="auth-container">
        <div class="auth-card">
            <h1>Admin Portal</h1>
            <p style="color: var(--text-secondary); margin-bottom: 30px;">Sign in to manage Roadside Helper</p>
            
            <form id="loginForm">
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" required placeholder="admin@roadside-helper.com">
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" required placeholder="••••••••">
                </div>
                <div id="error-message" class="error-message">Invalid credentials</div>
                <button type="submit" class="btn-primary" style="margin-top: 10px;">Sign In</button>
            </form>
        </div>
    </div>

    <script src="js/auth.js"></script>
</body>
</html>
