<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mechanics — Roadside Helper Admin</title>
    <meta name="description" content="Manage and approve mechanics in the Roadside Helper admin panel.">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/admin.css">
</head>
<body>
<div class="admin-container">
    <aside class="sidebar">
        <div class="logo">🛠️ Roadside Helper</div>
        <nav>
            <a href="dashboard.html" class="nav-item"><span class="icon">📊</span> Dashboard</a>
            <a href="requests.html" class="nav-item"><span class="icon">📋</span> Requests</a>
            <a href="mechanics.html" class="nav-item active"><span class="icon">👨‍🔧</span> Mechanics</a>
            <a href="analytics.html" class="nav-item"><span class="icon">📈</span> Analytics</a>
        </nav>
        <div class="sidebar-footer">
            <button onclick="logout()" class="logout-btn">Logout</button>
        </div>
    </aside>

    <main class="main-content">
        <header class="admin-header">
            <h1>Mechanics</h1>
            <div class="header-right">
                <span id="current-time" style="color: var(--text-secondary)"></span>
                <div class="user-menu">
                    <span id="admin-name" style="font-weight:500">Admin</span>
                    <img src="https://ui-avatars.com/api/?name=Admin&background=3b82f6&color=fff" alt="Admin">
                </div>
            </div>
        </header>

        <section class="content">
            <!-- Filters -->
            <div class="filter-bar">
                <div class="search-box">
                    <span class="search-icon">🔍</span>
                    <input type="text" id="searchInput" placeholder="Search by name, email or phone..." oninput="debounceSearch()">
                </div>
                <div class="filter-tabs">
                    <button class="filter-tab active" data-status="all" onclick="setStatus(this)">All</button>
                    <button class="filter-tab pending" data-status="pending" onclick="setStatus(this)">Pending</button>
                    <button class="filter-tab approved" data-status="approved" onclick="setStatus(this)">Approved</button>
                    <button class="filter-tab rejected" data-status="rejected" onclick="setStatus(this)">Rejected</button>
                </div>
            </div>

            <!-- Mechanic Cards Grid -->
            <div id="mechanics-grid" class="mechanics-grid">
                <div class="loading-placeholder">
                    <div class="spinner"></div> Loading mechanics...
                </div>
            </div>

            <!-- Pagination -->
            <div class="pagination" id="pagination"></div>
        </section>
    </main>
</div>

<!-- Mechanic Detail Modal -->
<div id="mechanicModal" class="modal-overlay" style="display:none">
    <div class="modal-card wide">
        <div class="modal-mechanic-header">
            <img id="modal-avatar" src="" alt="Mechanic">
            <div>
                <h3 id="modal-name"></h3>
                <p id="modal-location" style="color:var(--text-secondary)"></p>
            </div>
            <span id="modal-status-badge" class="badge"></span>
        </div>
        <div class="modal-details">
            <div class="detail-row"><span>📞 Phone</span><span id="modal-phone"></span></div>
            <div class="detail-row"><span>📧 Email</span><span id="modal-email"></span></div>
            <div class="detail-row"><span>⭐ Rating</span><span id="modal-rating"></span></div>
            <div class="detail-row"><span>🔧 Jobs Done</span><span id="modal-jobs"></span></div>
            <div class="detail-row"><span>📅 Experience</span><span id="modal-exp"></span></div>
            <div class="detail-row"><span>🛠️ Skills</span><span id="modal-skills"></span></div>
        </div>
        <div class="modal-actions" id="modal-actions"></div>
        <button class="modal-close" onclick="closeMechanicModal()">Close</button>
    </div>
</div>

<script src="js/mechanics.js"></script>
</body>
</html>
