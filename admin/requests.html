<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Requests — Roadside Helper Admin</title>
    <meta name="description" content="Manage all roadside service requests in the Roadside Helper admin panel.">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/admin.css">
</head>
<body>
<div class="admin-container">
    <aside class="sidebar">
        <div class="logo">🛠️ Roadside Helper</div>
        <nav>
            <a href="dashboard.html" class="nav-item"><span class="icon">📊</span> Dashboard</a>
            <a href="requests.html" class="nav-item active"><span class="icon">📋</span> Requests</a>
            <a href="mechanics.html" class="nav-item"><span class="icon">👨‍🔧</span> Mechanics</a>
            <a href="analytics.html" class="nav-item"><span class="icon">📈</span> Analytics</a>
        </nav>
        <div class="sidebar-footer">
            <button onclick="logout()" class="logout-btn">Logout</button>
        </div>
    </aside>

    <main class="main-content">
        <header class="admin-header">
            <h1>Service Requests</h1>
            <div class="header-right">
                <span id="current-time" style="color: var(--text-secondary)"></span>
                <div class="user-menu">
                    <span id="admin-name" style="font-weight:500">Admin</span>
                    <img src="https://ui-avatars.com/api/?name=Admin&background=3b82f6&color=fff" alt="Admin">
                </div>
            </div>
        </header>

        <section class="content">
            <!-- Filters -->
            <div class="filter-bar">
                <div class="search-box">
                    <span class="search-icon">🔍</span>
                    <input type="text" id="searchInput" placeholder="Search by name, vehicle or phone..." oninput="debounceSearch()">
                </div>
                <div class="filter-tabs" id="statusTabs">
                    <button class="filter-tab active" data-status="all" onclick="setStatus(this)">All</button>
                    <button class="filter-tab" data-status="pending" onclick="setStatus(this)">Pending</button>
                    <button class="filter-tab" data-status="assigned" onclick="setStatus(this)">Assigned</button>
                    <button class="filter-tab" data-status="completed" onclick="setStatus(this)">Completed</button>
                    <button class="filter-tab" data-status="cancelled" onclick="setStatus(this)">Cancelled</button>
                </div>
            </div>

            <!-- Table -->
            <div class="section">
                <div class="table-header">
                    <h3>Requests <span id="total-label" class="count-badge"></span></h3>
                </div>
                <table class="data-table">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Customer</th>
                            <th>Vehicle</th>
                            <th>Problem</th>
                            <th>Location</th>
                            <th>Status</th>
                            <th>Date</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody id="requests-tbody">
                        <tr><td colspan="8" class="loading-row"><div class="spinner"></div> Loading...</td></tr>
                    </tbody>
                </table>

                <!-- Pagination -->
                <div class="pagination" id="pagination"></div>
            </div>
        </section>
    </main>
</div>

<!-- Status Update Modal -->
<div id="statusModal" class="modal-overlay" style="display:none">
    <div class="modal-card">
        <h3>Update Request Status</h3>
        <p style="color:var(--text-secondary); margin-bottom:20px" id="modal-req-info"></p>
        <div class="modal-options">
            <button class="status-btn pending" onclick="updateStatus('pending')">🕐 Pending</button>
            <button class="status-btn assigned" onclick="updateStatus('assigned')">🔧 Assigned</button>
            <button class="status-btn completed" onclick="updateStatus('completed')">✅ Completed</button>
            <button class="status-btn cancelled" onclick="updateStatus('cancelled')">❌ Cancelled</button>
        </div>
        <button class="modal-close" onclick="closeModal()">Cancel</button>
    </div>
</div>

<script src="js/requests.js"></script>
</body>
</html>
